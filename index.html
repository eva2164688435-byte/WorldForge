      }
      
      const newCountry = {
        id: 'country_' + Date.now(),
        name: name,
        regionType: 'country',
        description: form.querySelector('textarea[name="countryDesc"]').value,
        landmarks: [],
        allies: [],
        enemies: []
      };
      
      data.towns.push(newCountry);
      saveData();
      
      closeCountryModal();
      showToast('国家创建成功', 'success');
      
      const townFormSelect = document.querySelector('#itemForm select[name="country"]');
      if (townFormSelect) {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        option.selected = true;
        townFormSelect.appendChild(option);
      }
    }

    // Avatar Preview
    function updateAvatarPreview(value) {
      const preview = document.querySelector('.avatar-preview');
      const hiddenInput = document.getElementById('avatarInputHidden');
      if (!preview) return;
      
      if (hiddenInput) hiddenInput.value = value;
      
      if (value) {
        preview.innerHTML = `<img src="${escapeHtml(value)}" alt="头像">`;
      } else {
        preview.innerHTML = '?';
      }
    }

    // Image Upload Handler
    let pendingImageData = null;
    let cropState = {
      x: 0,
      y: 0,
      width: 100,
      height: 100,
      aspectRatio: 1,
      imageWidth: 0,
      imageHeight: 0,
      quality: 80
    };

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      // Check file type
      if (!file.type.startsWith('image/')) {
        showToast('请选择图片文件', 'error');
        event.target.value = '';
        return;
      }
      
      const reader = new FileReader();
      reader.onload = (e) => {
        pendingImageData = e.target.result;
        openCropModal(pendingImageData, file.size);
      };
      reader.onerror = () => {
        showToast('图片读取失败', 'error');
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    function openCropModal(imageData, fileSize) {
      const modal = document.getElementById('cropModal');
      const img = document.getElementById('cropImage');
      const sizeInfo = document.getElementById('cropSizeInfo');
      
      img.src = imageData;
      sizeInfo.textContent = `原图大小: ${formatFileSize(fileSize)}`;
      
      // Reset crop state
      cropState = {
        x: 0,
        y: 0,
        width: 100,
        height: 100,
        aspectRatio: 1,
        imageWidth: 0,
        imageHeight: 0,
        quality: 80
      };
      
      img.onload = () => {
        cropState.imageWidth = img.naturalWidth;
        cropState.imageHeight = img.naturalHeight;
        
        // Initialize crop box to full image
        const container = img.parentElement;
        const containerWidth = container.clientWidth;
        const containerHeight = container.clientHeight;
        
        const scale = Math.min(containerWidth / img.naturalWidth, containerHeight / img.naturalHeight);
        const displayWidth = img.naturalWidth * scale;
        const displayHeight = img.naturalHeight * scale;
        
        cropState.width = displayWidth;
        cropState.height = displayHeight;
        cropState.x = (containerWidth - displayWidth) / 2;
        cropState.y = (containerHeight - displayHeight) / 2;
        
        updateCropBox();
        setActivePreset(100);
      };
      
      // Setup quality slider
      const qualitySlider = document.getElementById('qualitySlider');
      qualitySlider.value = 80;
      document.getElementById('qualityValue').textContent = '80';
      cropState.quality = 80;
      
      modal.classList.add('active');
    }

    function closeCropModal() {
      document.getElementById('cropModal').classList.remove('active');
      pendingImageData = null;
    }

    function setActivePreset(ratio) {
      document.querySelectorAll('.crop-preset').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.size) === ratio);
      });
    }

    function updateCropBox() {
      const box = document.getElementById('cropBox');
      box.style.left = cropState.x + 'px';
      box.style.top = cropState.y + 'px';
      box.style.width = cropState.width + 'px';
      box.style.height = cropState.height + 'px';
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function applyCrop() {
      if (!pendingImageData) return;
      
      const img = document.getElementById('cropImage');
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      
      // Calculate actual crop coordinates relative to original image
      const container = document.querySelector('.crop-container');
      const imgRect = img.getBoundingClientRect();
      const containerRect = container.getBoundingClientRect();
      
      const scaleX = img.naturalWidth / imgRect.width;
      const scaleY = img.naturalHeight / imgRect.height;
      
      const cropX = (cropState.x - (imgRect.left - containerRect.left)) * scaleX;
      const cropY = (cropState.y - (imgRect.top - containerRect.top)) * scaleY;
      const cropW = cropState.width * scaleX;
      const cropH = cropState.height * scaleY;
      
      // Set output size
      const outputSize = 200; // Fixed output size for avatar
      canvas.width = outputSize;
      canvas.height = outputSize * (cropH / cropW);
      
      // Draw cropped image
      ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);
      
      // Compress
      const quality = cropState.quality / 100;
      const base64 = canvas.toDataURL('image/jpeg', quality);
      
      updateAvatarPreview(base64);
      closeCropModal();
      showToast('图片已裁剪压缩', 'success');
    }

    // Crop interaction handlers
    document.addEventListener('DOMContentLoaded', () => {
      const cropBox = document.getElementById('cropBox');
      const container = document.querySelector('.crop-container');
      
      if (!cropBox || !container) return;
      
      let isDragging = false;
      let isResizing = false;
      let resizeHandle = null;
      let startX, startY, startCropX, startCropY, startCropW, startCropH;
      
      cropBox.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('crop-handle')) {
          isResizing = true;
          resizeHandle = e.target.classList.contains('nw') ? 'nw' :
                        e.target.classList.contains('ne') ? 'ne' :
                        e.target.classList.contains('sw') ? 'sw' : 'se';
        } else {
          isDragging = true;
        }
        startX = e.clientX;
        startY = e.clientY;
        startCropX = cropState.x;
        startCropY = cropState.y;
        startCropW = cropState.width;
        startCropH = cropState.height;
        e.preventDefault();
      });
      
      document.addEventListener('mousemove', (e) => {
        if (!isDragging && !isResizing) return;
        
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        
        if (isDragging) {
          cropState.x = Math.max(0, Math.min(container.clientWidth - cropState.width, startCropX + dx));
          cropState.y = Math.max(0, Math.min(container.clientHeight - cropState.height, startCropY + dy));
        } else if (isResizing) {
          const aspectRatio = cropState.aspectRatio || 1;
          let newW = startCropW;
          let newH = startCropH;
          
          if (resizeHandle.includes('e')) newW = Math.max(50, startCropW + dx);
          if (resizeHandle.includes('w')) newW = Math.max(50, startCropW - dx);
          if (resizeHandle.includes('s')) newH = Math.max(50, startCropH + dy);
          if (resizeHandle.includes('n')) newH = Math.max(50, startCropH - dy);
          
          // Maintain aspect ratio
          if (cropState.aspectRatio) {
            newH = newW / cropState.aspectRatio;
          }
          
          // Constrain to container
          newW = Math.min(newW, container.clientWidth - cropState.x);
          newH = Math.min(newH, container.clientHeight - cropState.y);
          
          cropState.width = newW;
          cropState.height = newH;
        }
        
        updateCropBox();
      });
      
      document.addEventListener('mouseup', () => {
        isDragging = false;
        isResizing = false;
        resizeHandle = null;
      });
      
      // Preset buttons
      document.querySelectorAll('.crop-preset').forEach(btn => {
        btn.addEventListener('click', () => {
          const preset = parseInt(btn.dataset.size);
          cropState.aspectRatio = preset / 100;
          
          const container = document.querySelector('.crop-container');
          const maxW = container.clientWidth * 0.8;
          const maxH = container.clientHeight * 0.8;
          
          let newW, newH;
          if (preset === 100) {
            newW = Math.min(maxW, maxH);
            newH = newW;
          } else if (preset === 150) {
            newW = Math.min(maxW, maxH * 1.5);
            newH = newW / 1.5;
          } else {
            newH = Math.min(maxH, maxW * 1.5);
            newW = newH * 1.5;
          }
          
          cropState.width = newW;
          cropState.height = newH;
          cropState.x = (container.clientWidth - newW) / 2;
          cropState.y = (container.clientHeight - newH) / 2;
          
          updateCropBox();
          setActivePreset(preset);
        });
      });
      
      // Quality slider
      document.getElementById('qualitySlider').addEventListener('input', (e) => {
        cropState.quality = parseInt(e.target.value);
        document.getElementById('qualityValue').textContent = e.target.value;
      });
    });

    // Tag Input
    function setupTagInputs() {
      document.querySelectorAll('.tag-input').forEach(input => {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const value = input.value.trim();
            if (value) {
              const container = input.parentElement;
              const tag = document.createElement('span');
              tag.className = 'tag';
              tag.innerHTML = `${escapeHtml(value)}<span class="tag-remove" onclick="removeTag(this, 'personality')">&times;</span>`;
              container.insertBefore(tag, input);
              input.value = '';
              updateHiddenTags(container.dataset.field);
            }
          }
        });
      });
    }

    function removeTag(el, field) {
      el.parentElement.remove();
      const container = document.querySelector(`.tag-container[data-field="${field}"]`);
      if (container) updateHiddenTags(field);
    }

    function updateHiddenTags(field) {
      const container = document.querySelector(`.tag-container[data-field="${field}"]`);
      if (!container) return;
      const tags = Array.from(container.querySelectorAll('.tag')).map(t => t.textContent.replace('×', '').trim());
      const hidden = container.parentElement.querySelector(`input[name="${field}"]`);
      if (hidden) hidden.value = tags.join(',');
    }

    // List Item
    function addListItem(field) {
      const input = document.getElementById(`new${capitalize(field)}Input`);
      const value = input.value.trim();
      if (!value) return;

      const list = document.getElementById(`${field}List`);
      
      // Remove empty state if exists
      const emptyState = list.querySelector('.list-empty-state');
      if (emptyState) emptyState.remove();

      const item = document.createElement('div');
      item.className = 'list-item';
      item.innerHTML = `<span class="list-item-content" ondblclick="editListItem(this, '${field}')">${escapeHtml(value)}</span><div class="list-item-actions"><button class="list-item-btn remove" onclick="confirmRemoveListItem('${field}', this)" title="删除"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>`;
      list.appendChild(item);
      input.value = '';
      showToast('已添加', 'success');
    }

    function editListItem(el, field) {
      const text = el.textContent;
      const input = document.createElement('input');
      input.type = 'text';
      input.value = text;
      input.className = 'list-item-input';
      input.style.width = `${Math.max(text.length * 14 + 40, 100)}px`;
      
      el.parentNode.replaceChild(input, el);
      input.focus();
      input.select();
      
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          saveEdit(input, field);
        } else if (e.key === 'Escape') {
          cancelEdit(input, text);
        }
      });
      
      input.addEventListener('blur', function() {
        saveEdit(input, field);
      });
    }

    function saveEdit(input, field) {
      const value = input.value.trim();
      if (value) {
        const span = document.createElement('span');
        span.className = 'list-item-content';
        span.innerHTML = `${escapeHtml(value)}`;
        span.setAttribute('ondblclick', `editListItem(this, '${field}')`);
        input.parentNode.replaceChild(span, input);
        showToast('已保存', 'success');
      } else {
        cancelEdit(input, '');
      }
    }

    function cancelEdit(input, originalText) {
      const span = document.createElement('span');
      span.className = 'list-item-content';
      span.innerHTML = originalText ? `${escapeHtml(originalText)}` : '';
      span.setAttribute('ondblclick', `editListItem(this, '${field}')`);
      input.parentNode.replaceChild(span, input);
    }

    function confirmRemoveListItem(field, el) {
      const listItem = el.closest('.list-item');
      const itemText = listItem.querySelector('.list-item-content').textContent;
      
      showConfirmDialog(
        '确认删除',
        `确定要删除 "${itemText}" 吗？`,
        function() {
          removeListItem(field, listItem);
          showToast('已删除', 'success');
        }
      );
    }

    function removeListItem(field, listItem) {
      listItem.remove();
      
      const list = document.getElementById(`${field}List`);
      if (list.querySelectorAll('.list-item').length === 0) {
        list.innerHTML = '<div class="list-empty-state">暂无内容，点击上方"添加"按钮添加</div>';
      }
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function toggleFactionFields(regionType) {
      const factionFields = document.querySelectorAll('.faction-field');
      const isCountryOrTown = regionType === 'country' || regionType === 'town';
      factionFields.forEach(field => {
        field.style.display = isCountryOrTown ? 'block' : 'none';
      });
    }

    // Tag Add Modal
    let currentTagField = '';

    function openTagAddModal(field) {
      currentTagField = field;
      document.getElementById('tagAddModal').classList.add('active');
      document.getElementById('tagInput').value = '';
      document.getElementById('tagInput').focus();
    }

    function closeTagAddModal() {
      document.getElementById('tagAddModal').classList.remove('active');
      currentTagField = '';
    }

    function addTagFromModal() {
      const input = document.getElementById('tagInput');
      const value = input.value.trim();
      
      if (!value) {
        showToast('请输入标签内容', 'error');
        return;
      }

      const container = document.querySelector(`.tag-container[data-field="${currentTagField}"]`);
      if (!container) {
        closeTagAddModal();
        return;
      }

      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.innerHTML = `${escapeHtml(value)}<span class="tag-remove" onclick="removeTag(this, '${currentTagField}')">&times;</span>`;
      
      const tagInput = container.querySelector('.tag-input');
      container.insertBefore(tag, tagInput);
      
      updateHiddenTags(currentTagField);
      closeTagAddModal();
      showToast('标签已添加', 'success');
    }

    // Save
    function saveCurrentItem() {
      const form = document.getElementById('itemForm');
      const formData = new FormData(form);
      const item = {};

      // Get simple fields
      for (const [key, value] of formData.entries()) {
        if (key !== 'personality') {
          item[key] = value;
        }
      }

      // Get personality tags
      const personalityTags = Array.from(document.querySelectorAll('.tag-container[data-field="personality"] .tag'))
        .map(t => t.textContent.replace('×', '').trim());
      item.personality = personalityTags;

      // Get list items
      ['abilities', 'landmarks', 'allies', 'enemies'].forEach(field => {
        const listItems = document.querySelectorAll(`#${field}List .list-item span:first-child`);
        item[field] = Array.from(listItems).map(l => l.textContent.trim());
      });

      // Validate
      if (currentSection === 'characters' && !item.name) {
        showToast('请输入人物姓名', 'error');
        return;
      }
      if (currentSection === 'towns' && !item.name) {
        showToast('请输入地区名称', 'error');
        return;
      }
      if (currentSection === 'races' && !item.name) {
        showToast('请输入种族名称', 'error');
        return;
      }

      // Save
      if (currentEditId) {
        const index = data[currentSection].findIndex(i => i.id === currentEditId);
        if (index !== -1) {
          data[currentSection][index] = { ...data[currentSection][index], ...item };
        }
      } else {
        item.id = generateId();
        data[currentSection].push(item);
      }

      saveData();
      closeModal();
      renderCurrentSection();
      showToast('保存成功', 'success');
    }

    // Delete
    function togglePin(type, id) {
      const item = data[type].find(i => i.id === id);
      if (!item) return;
      
      item.pinned = !item.pinned;
      saveData();
      
      if (type === 'characters') {
        data.characters.sort((a, b) => {
          if (a.pinned && !b.pinned) return -1;
          if (!a.pinned && b.pinned) return 1;
          return 0;
        });
      }
      
      renderCurrentSection();
      showToast(item.pinned ? '已置顶' : '已取消置顶', 'success');
    }

    function deleteItem(type, id) {
      const item = data[type].find(i => i.id === id);
      if (!item) return;

      showConfirmDialog(
        '确认删除',
        `确定要删除"${item.name}"吗？此操作不可撤销。`,
        () => {
          data[type] = data[type].filter(i => i.id !== id);
          saveData();
          renderCurrentSection();
          showToast('删除成功', 'success');
        }
      );
    }

    // Confirm Dialog
    function showConfirmDialog(title, message, callback) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMessage').textContent = message;
      confirmCallback = callback;
      document.getElementById('confirmDialog').classList.add('active');
    }

    function closeConfirmDialog() {
      document.getElementById('confirmDialog').classList.remove('active');
      confirmCallback = null;
    }

    function confirmAction() {
      if (confirmCallback) confirmCallback();
      closeConfirmDialog();
    }

    // Export/Import
    function exportData() {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `worldforge_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('数据已导出', 'success');
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.characters && imported.towns && imported.races) {
            data = imported;
            saveData();
            renderCurrentSection();
            showToast('数据导入成功', 'success');
          } else {
            showToast('无效的数据格式', 'error');
          }
        } catch (err) {
          showToast('导入失败：' + err.message, 'error');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // Toast
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <svg viewBox="0 0 24 24">
          ${type === 'success' 
            ? '<polyline points="20 6 9 17 4 12"/>' 
            : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'}
        </svg>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // Utility
    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    // Close modal on overlay click
    document.getElementById('createModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeModal();
    });
    document.getElementById('confirmDialog').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeConfirmDialog();
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
        closeConfirmDialog();
      }
    });
  </script>
</body>
